name: Devenv

on:
  push:
    branches: [ master, '*' ]
  pull_request:
    branches: [ master, '*' ]

jobs:
  tests:
  # see https://github.com/ruby/setup-ruby
    strategy:
      matrix:
        os: [ubuntu-latest]
        ruby-version: [ 3.2, 3.3, 3.4, 'head']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile install nixpkgs#devenv
      - name: Test with Ruby ${{ matrix.ruby-version }}
        run: |
          devenv --option languages.ruby.enable:bool true \
                 --option languages.ruby.version:string ${{ matrix.ruby-version }} \
                 test
